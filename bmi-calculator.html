<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BMI & Calorie Recommendation</title>
  <link rel="stylesheet" href="bmi-style.css" />
</head>
<body>
 <div class="homebtn">
  <a href="index.html">Home</a>
 </div>

  
  <div class="container">
    <h1>BMI CALCULATOR</h1>
    <form id="bmiForm">
      <input type="number" placeholder="Height (cm)" id="height" required />
      <input type="number" placeholder="Weight (kg)" id="weight" required />
      <input type="number" placeholder="Age" id="age" required />
      <select id="gender" required>
        <option value="">Select Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
      <select id="activity" required>
        <option value="">Activity Level</option>
        <option value="1.2">Sedentary</option>
        <option value="1.375">Lightly Active</option>
        <option value="1.55">Moderately Active</option>
        <option value="1.725">Very Active</option>
      </select>

      <h3>Weight Goal</h3>
      <select id="goal" required>
        <option value="">Choose Goal</option>
        <option value="gain">Gain Weight</option>
        <option value="lose">Lose Weight</option>
      </select>
      <input type="number" placeholder="Kgs to Gain/Lose" id="kgChange" required />
      <input type="number" placeholder="Duration (months)" id="months" required />

      <button type="submit">Calculate</button>
    </form>

    <div id="result"></div>
  </div>
  <!-- Chatbox -->
<div class="chatbox">
  <div class="chat-header">💬 Diet Chat</div>
  <div class="chat-body" id="chat-body">
    <div class="bot">Hi! Tell me your goal (weight loss/gain), calorie needs & food preference.</div>
  </div>
  <div class="chat-input">
    <input type="text" id="chat-input" placeholder="Type your message..." />
    <button id="send-btn">Send</button>
  </div>
</div>


  <script src="bmi-script.js"></script>
</body>
</html>
