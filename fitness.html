<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fitness Dashboard</title>
  <link rel="stylesheet" href="fitness.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="navbar">
    <div class="logo">HealthIT</div>
    <nav>
      <a href="#workout">Workout Plan</a>
      <a href="#progress">Progress</a>
      <a href="index.html">Home</a>
      <a href="diet.html">Diet Plan</a>
    </nav>
  </header>

  <main>
    <!-- Workout Plan Generator -->
    <section id="workout" class="card">
      <h2>Personalized Workout Plan Generator</h2>
      <form id="workout-form">
        <label>Current Weight (kg):
          <input type="number" id="currentWeight" required>
        </label>
        <label>Goal Weight (kg):
          <input type="number" id="goalWeight" required>
        </label>
        <label>Duration (in Months):
          <input type="number" id="duration" required>
        </label>
        <label>Goal:
          <select id="goal" required>
            <option value="">Select...</option>
            <option value="weightloss">Weight Loss</option>
            <option value="muscle">Muscle Gain</option>
            <option value="endurance">Endurance</option>
          </select>
        </label>
        <label>Experience Level:
          <select id="level" required>
            <option value="">Select...</option>
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
        </label>
        <label>Days per Week:
          <input type="number" id="days" min="1" max="7" required>
        </label>
        <button type="submit">Generate Plan</button>
      </form>
      <div id="workout-result"></div>
    </section>

    <!-- Fitness Progress Dashboard -->
    <section id="progress" class="card">
      <h2>Fitness Progress Dashboard</h2>
      <canvas id="progressChart" width="400" height="200"></canvas>
    </section>
  </main>

  <script src="fitness.js"></script>
</body>
</html>
